name: Recompilation problem
description: Static binary translation fails, or the translated program does not behave like the original. Low priority.
labels: ["low-prio"]
body:
  - type: markdown
    attributes:
      value: |
        > [!NOTE]
        > Static binary translation has not been a core goal for a long time: we are focused on decompilation and use it mostly for regression testing. These issues are low priority: we fix bugs, but we don't plan to extend it.

        This is for `revng quick artifact recompile`. Wrong or non-compiling decompiled C goes in *Wrong decompiled output*.

        **A reproducer binary is mandatory: issues without one will be closed.**

  - type: input
    id: version
    attributes:
      label: rev.ng version
      placeholder: revng --version
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Binary distribution (install.sh)
        - Docker image (revng/revng)
        - orchestra
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: Zip the binary and attach it, or email it to `info@rev.ng`.
      placeholder: Drop reproducer.zip here
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Does rev.ng fail, or does the translated program misbehave?
    validations:
      required: true

  - type: textarea
    id: commands
    attributes:
      label: Commands
      placeholder: |
        revng quick artifact recompile ./program -o program.translated
        chmod +x program.translated
        ./program.translated
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: Error message and full stack trace, or the output of both programs.
      render: text
    validations:
      required: true

  - type: checkboxes
    id: recap
    attributes:
      label: Final recap
      options:
        - label: "This is a bug, not a question or a support request (those go on [Discord](https://discord.gg/wEQtgKJxcX) or [Discourse](https://discuss.rev.ng/))."
          required: true
        - label: "This is not a duplicate of an [existing issue](https://github.com/revng/revng/issues?q=is%3Aissue)."
          required: true
        - label: "I installed rev.ng [as documented](https://docs.rev.ng/user-manual/initial-setup/) (binary distribution, Docker image or orchestra)."
          required: true
        - label: "The problem still happens with the latest version of rev.ng."
          required: true
        - label: "This issue reports a single problem."
          required: true
        - label: "I attached the binary or emailed it to info@rev.ng. Links open without logging in. Issues without a reproducer will be closed."
          required: true
        - label: "Commands and output are text, not screenshots."
          required: true
        - label: "I understand that static binary translation is low priority."
          required: true
