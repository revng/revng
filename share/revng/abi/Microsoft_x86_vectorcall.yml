ABI: Microsoft_x86_vectorcall

ArgumentsArePositionBased: false
OnlyStartDoubleArgumentsFromAnEvenRegister: false
ArgumentsCanBeSplitBetweenRegistersAndStack: false
BigArgumentsUsePointersToCopy: false
NoRegisterArgumentsCanComeAfterStackOnes: false
AllowPackedTypesInRegisters: true
CalleeIsResponsibleForStackCleanup: true
FloatsUseGPRs: false
PackStackArguments: false
TreatAllAggregatesAsPacked: false

StackAlignment: 4
MinimumStackArgumentSize: 4

MaximumGPRsPerAggregateArgument: 0
MaximumGPRsPerAggregateReturnValue: 2
MaximumGPRsPerScalarArgument: 1
MaximumGPRsPerScalarReturnValue: 2

GeneralPurposeArgumentRegisters:
  - ecx_x86
  - edx_x86
GeneralPurposeReturnValueRegisters:
  - eax_x86
  - edx_x86
VectorArgumentRegisters:
  - xmm0_x86
  - xmm1_x86
  - xmm2_x86
  - xmm3_x86
  - xmm4_x86
  - xmm5_x86
VectorReturnValueRegisters:
  - xmm0_x86
CalleeSavedRegisters:
  - ebx_x86
  - ebp_x86
  - edi_x86
  - esi_x86
  - xmm6_x86
  - xmm7_x86

ReturnValueLocationOnStack: true
ReturnValueLocationIsReturned: true

ScalarTypes:
  - Kind: Integer
    Size: 1
  - Kind: Integer
    Size: 2
  - Kind: Integer
    Size: 4
  - Kind: Integer
    Size: 8
    AlignedAt: 4 # TODO: The correct value is 8, but stack arguments align to 4.
  - Kind: FloatingPoint
    Size: 2 # IEEE Binary16
  - Kind: FloatingPoint
    Size: 4 # IEEE Binary32
  - Kind: FloatingPoint
    Size: 8 # IEEE Binary64

PrimitiveAliases:
  - Name: size_t
    Kind: Unsigned
    Size: 4
  - Name: ptrdiff_t
    Kind: Signed
    Size: 4
