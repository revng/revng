ABI: SystemV_x86_regparm_1

ArgumentsArePositionBased: false
OnlyStartDoubleArgumentsFromAnEvenRegister: false
ArgumentsCanBeSplitBetweenRegistersAndStack: false
BigArgumentsUsePointersToCopy: false
NoRegisterArgumentsCanComeAfterStackOnes: true
AllowPackedTypesInRegisters: true
CalleeIsResponsibleForStackCleanup: false
PackStackArguments: false
TreatAllAggregatesAsPacked: false

FloatingPointArgumentStrategy: Ignored
FloatingPointReturnValueStrategy: Ignored

StackAlignment: 16
MinimumStackArgumentSize: 4

MaximumGPRsPerAggregateArgument: 1
MaximumGPRsPerAggregateReturnValue: 0
MaximumGPRsPerScalarArgument: 1
MaximumGPRsPerScalarReturnValue: 2

GeneralPurposeArgumentRegisters:
  - eax_x86
GeneralPurposeReturnValueRegisters:
  - eax_x86
  - edx_x86
CalleeSavedRegisters:
  - ebx_x86
  - ebp_x86
  - edi_x86
  - esi_x86

ReturnValueLocationRegister: eax_x86
ReturnValueLocationIsReturned: true

ScalarTypes:
  - Kind: Integer
    Size: 1
  - Kind: Integer
    Size: 2
  - Kind: Integer
    Size: 4
  - Kind: Integer
    Size: 8
    AlignedAt: 4

  - Kind: FloatingPoint
    Size: 4 # IEEE Binary32
  - Kind: FloatingPoint
    Size: 8 # IEEE Binary64
    AlignedAt: 4

  - Kind: Integer
    Size: 32 # `ymm` register-sized generic

    # NOTE: this alignment is likely to be wrong. Such a "primitive" is likely
    #       a vector, so its alignment depends on what's inside it. We currently
    #       do not have a way to "look" inside such a vector, but we need to set
    #       *an* alignment value. Pointer-sized alignment is the most likely
    #       candidate that wouldn't cause unexpected problems elsewhere (like
    #       stack argument structs).
    AlignedAt: 8
  - Kind: Integer
    Size: 64 # `zmm` register-sized generic

    # NOTE: this alignment is likely to be wrong. Such a "primitive" is likely
    #       a vector, so its alignment depends on what's inside it. We currently
    #       do not have a way to "look" inside such a vector, but we need to set
    #       *an* alignment value. Pointer-sized alignment is the most likely
    #       candidate that wouldn't cause unexpected problems elsewhere (like
    #       stack argument structs).
    AlignedAt: 8

PrimitiveAliases:
  - Name: size_t
    Kind: Unsigned
    Size: 4
  - Name: ptrdiff_t
    Kind: Signed
    Size: 4
