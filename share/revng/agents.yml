claude:
  - claude
codex:
  - codex
  - --no-daemon
  # By default codex runs commands with sandboxing, which causes errors such as
  # `Directory '$HOME/.cache/revng' is not writable`, which is confusing for the
  # user. Moreover it continuously asks to run each `revng` command without any
  # option to allow all `revng *` commands. To circumvent both of these issues
  # run the agent without the sandbox.
  - --sandbox
  - danger-full-access
opencode:
  - opencode
  - --prompt
