commands:
  - type: revng-prss.test-cli
    from:
      - type: revng-qa.compiled
        filter: example-executable-1 and with-debug-info
    command: |-
      "${SOURCES_ROOT}/share/revng/test/tests/prss/test-cli.sh" "$INPUT"

  - type: revng-prss.test-daemon
    from:
      - type: revng-qa.compiled
        filter: example-executable-1 and with-debug-info
    command: |-
      "${SOURCES_ROOT}/share/revng/test/tests/prss/test-daemon.sh" "$INPUT"
