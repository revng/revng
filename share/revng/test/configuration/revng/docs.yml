commands:
  - type: revng.test-docs
    # TODO: Ignore the following, it's just to run the command once
    from:
      - type: revng-qa.compiled
        filter: example-executable-1 and with-debug-info
    # Excluded files have doctest blocks that bake in orchestra-specific
    # environmental assumptions:
    #
    # * initial-setup.md: `git clone https://github.com/revng/orchestra` —
    #   orchestra's build env has both git and network access; the nix
    #   sandbox has neither.
    # * running-analyses.md: `gcc example.c -O2` — the doctest compiles a
    #   binary with whatever gcc is in PATH, then imports it via
    #   `revng analyze import-binary`. orchestra's PATH has gcc 9.2.0;
    #   ours has the nix host gcc 14.3.0. gcc-14 emits a slightly
    #   different ELF (Segment metadata) so import-binary's serialized
    #   model has `Type:` where the expected_output.log has
    #   `IsExecutable: true`.
    command: revng test-docs $$(find "$$(revng internal find-path share/doc/revng)" -name "*.md" -not -name "initial-setup.md" -not -name "running-analyses.md")
