commands:
  - type: revng.test-collect-cfg
    from:
      - type: revng-qa.compiled
        filter: for-collect-cfg and !stripped
    command: |-
      revng2 quick artifact emit-cfg --analyses=parse-binary,detect-abi --yaml "$INPUT" -- --debug-names |
        yq -r '.[] | values' |
        yq -sy . |
        ./filter.py |
        revng model to-json --remap |
        revng model compare "${SOURCE}.cfg.yml"
    scripts:
      filter.py: |-
        #!/usr/bin/env python3

        import sys
        import yaml

        def should_keep(cfg):
            if cfg.get("Name", ""):
                return True

            for block in cfg["Blocks"]:
                for successor in block["Successors"]:
                    if successor.get("DynamicFunction", ""):
                        return True

            return False

        cfgs = [cfg for cfg in yaml.safe_load(sys.stdin.read()) if should_keep(cfg)]
        print(yaml.dump(cfgs))
