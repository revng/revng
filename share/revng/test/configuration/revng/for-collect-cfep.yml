commands:
  - type: revng.test-collect-cfep
    from:
      - type: revng-qa.compiled-with-debug-info
        filter: for-collect-cfep
    command: |-
      revng quick analyze "$INPUT" |
        FileCheck --ignore-case "${SOURCE}".yml.filecheck
