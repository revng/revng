commands:
  #
  # Run revng's initial autoanalysis
  #
  - type: revng.analyzed-model
    from:
      - type: revng-qa.compiled
        filter: one-per-architecture
    suffix: /
    command: revng2 -C "$OUTPUT" project init "$INPUT"

  #
  # Perform lifting
  #
  - type: revng.lifted
    from:
      - type: revng.analyzed-model
    suffix: /
    command: |-
      cp -Tar "$INPUT" "$OUTPUT";
      revng2 -C "$OUTPUT" project artifact lift -o /dev/null;

  #
  # Produce enforce-abi artifact from revng.lifted
  #
  - type: revng.enforce-abi
    from:
      - type: revng.lifted
    suffix: /
    command: |-
      cp -Tar "$INPUT" "$OUTPUT";
      revng2 -C "$OUTPUT" project artifact enforce-abi -o /dev/null;

  #
  # Produce hexdump artifact from revng.lifted
  #
  - type: revng.hexdump
    from:
      - type: revng.lifted
    suffix: /
    command: |-
      cp -Tar "$INPUT" "$OUTPUT";
      revng2 -C "$OUTPUT" project artifact hexdump -o /dev/null;

  #
  # Produce render-svg-call-graph artifact from revng.lifted
  #
  - type: revng.render-svg-call-graph
    from:
      - type: revng.lifted
    suffix: /
    command: |-
      cp -Tar "$INPUT" "$OUTPUT";
      revng2 -C "$OUTPUT" project artifact render-svg-call-graph -o /dev/null;

  #
  # Produce render-svg-call-graph-slice artifact from revng.lifted
  #
  - type: revng.render-svg-call-graph-slice
    from:
      - type: revng.lifted
    suffix: /
    command: |-
      cp -Tar "$INPUT" "$OUTPUT";
      revng2 -C "$OUTPUT" project artifact render-svg-call-graph-slice -o /dev/null;

  #
  # Produce disassemble artifact from revng.lifted
  #
  - type: revng.disassemble
    from:
      - type: revng.lifted
    suffix: /
    command: |-
      cp -Tar "$INPUT" "$OUTPUT";
      revng2 -C "$OUTPUT" project artifact disassemble -o /dev/null;

  #
  # Produce render-svg-cfg artifact from revng.lifted
  #
  - type: revng.render-svg-cfg
    from:
      - type: revng.lifted
    suffix: /
    command: |-
      cp -Tar "$INPUT" "$OUTPUT";
      revng2 -C "$OUTPUT" project artifact render-svg-cfg -o /dev/null;

  #
  # Produce a tarball of decompile files from revng.analyzed-model
  # Also compare the members of the produced tar file and the input model,
  # both should contain the same members (except the extension).
  #
  # TODO: remove this when the old pipeline is removed
  - type: revng.legacy.decompiled-c-tar
    from:
      - type: revng-qa.compiled
        filter: one-per-architecture
    suffix: /
    command: |-
      revng artifact
        --resume "$OUTPUT"
        --analyze
        decompile "$INPUT" > "$OUTPUT/decompiled.tar.gz";

      diff -u <(yq -r '.Functions[].Entry' "$OUTPUT/context/model.yml" | sort)
              <(tar -tf "$OUTPUT/decompiled.tar.gz" | sed 's|\.c\.ptml$$||' | sort);

  #
  # Produce legacy single decompiled file and headers from revng.analyzed-model
  #
  # TODO: drop this when the old backend is dropped
  - type: revng.legacy.decompiled-c
    from:
      - type: revng-qa.compiled
        filter: one-per-architecture
      - type: revng.analyzed-model
    suffix: /
    command: |-
      ./emit-and-check-c decompile-to-single-file "$INPUT1" "$INPUT2/model.yml" "$OUTPUT" "$POINTER_SIZE" -Wno-shift-count-overflow

  #
  # Produce the emit-c artifact and check the resulting C code
  #
  # TODO: port this to the new pipeline once it has the `emit-helpers-header` artifact
  - type: revng.emit-and-check-c
    from:
      - type: revng-qa.compiled
        filter: one-per-architecture
      - type: revng.analyzed-model
    suffix: /
    command: |-
      ./emit-and-check-c emit-c-as-single-file "$INPUT1" "$INPUT2/model.yml" "$OUTPUT" "$POINTER_SIZE"
    scripts:
      emit-and-check-c: |-
        #!/usr/bin/env bash

        set -euo pipefail

        ARTIFACT="$1"
        shift
        BINARY="$1"
        shift
        MODEL="$1"
        shift
        RESUME="$1"
        shift
        POINTER_SIZE="$1"
        shift

        OUTDIR="$RESUME/e2e-test-$ARTIFACT"
        mkdir -p "$OUTDIR"

        revng artifact \
          --model "$MODEL" \
          --resume "$RESUME" \
          emit-helpers-header \
          "$BINARY" \
        | revng ptml > "$OUTDIR/helpers.h"

        revng artifact \
          --model "$MODEL" \
          --resume "$RESUME" \
          legacy-emit-model-header \
          "$BINARY" \
        | revng ptml > "$OUTDIR/types-and-globals.h"

        revng artifact \
          --model "$MODEL" \
          --resume "$RESUME" \
          "$ARTIFACT" \
          "$BINARY" \
        | revng ptml > "$OUTDIR/decompiled.c"

        DEFINES=""
        if [ "$ARTIFACT" == "decompile-to-single-file" ]; then
          DEFINES="-DLEGACY_BACKEND"
        fi

        revng check-decompiled-c "$OUTDIR/decompiled.c" -I"$OUTDIR" "$@" -m"$POINTER_SIZE" $DEFINES \
          |& tee "$OUTDIR/check-decompiled-c.log"
