commands:
  # This reuses abi-centric test binaries to ensure they can always go through
  # the whole pipeline (without any analyses) without crashing.
  - type: revng.runtime-segregation-tests
    from:
      - type: revng-qa.runtime-abi-tests
    command: |-
      INPUT=$$(realpath "$INPUT");
      cd "$$(temp -d)";
      revng2 project init --overwrite --no-initial-auto-analysis "$$INPUT/functions";
      revng2 project analyze parse-binary -o /dev/null -- --use-pdb="$$INPUT/functions.pdb";
      python3 "${SOURCES_ROOT}/share/revng/test/tests/abi/prepare-tested-model.py"
        "${ABI_NAME}" revng.yml revng.yml;
      revng2 project artifact emit-c-as-single-file -o decompiled.c.ptml;
      revng ptml decompiled.c.ptml -o decompiled.c
