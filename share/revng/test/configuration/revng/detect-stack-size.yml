commands:
  #
  # Run detect-stack-size and test against ground truth
  #
  - type: revng.test-detect-stack-size
    from:
      - type: revng-qa.compiled-with-debug-info
        filter: for-detect-stack-size
    suffix: /
    command: |-
      cd "$OUTPUT";
      revng project init --overwrite --no-initial-auto-analysis "$INPUT";
      revng project analyze parse-binary -o /dev/null;
      revng project analyze detect-abi -o /dev/null;
      revng project analyze detect-stack-size | revng model compare "${SOURCE}.model.yml" -;
