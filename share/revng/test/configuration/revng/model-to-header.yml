tags:
  - name: model-to-header

sources:
  - tags: [model-to-header]
    prefix: share/revng/test/tests/model-to-header
    members:
      - struct.h.model.yml
      - primitive-types.h.model.yml
      - union.h.model.yml
      - pointer-to-struct.h.model.yml
      - annotate-attibutes.model.yml

commands:
  - type: revng.legacy-model-to-header-test
    from:
      - type: source
        filter: model-to-header
    suffix: .h
    command: |-
      PROJECT_DIR=$$(temp -d);
      cp "$INPUT" "$$PROJECT_DIR/model.yml";
      revng2 -C "$$PROJECT_DIR" project artifact legacy-emit-model-header |
        yq -r '.["/binary"]' |
        revng ptml > "$OUTPUT";
      revng check-decompiled-c "$OUTPUT";
      FileCheck --input-file="$OUTPUT" "${SOURCE}.filecheck";
