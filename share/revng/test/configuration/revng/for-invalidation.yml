commands:
  - type: revng.test-invalidation
    from:
      - type: revng-qa.compiled-stripped
        filter: for-invalidation
    command: |-
      shopt -s nullglob;
      for FILECHECK in "${COMMAND_ROOT}/${SOURCE}."*".filecheck"; do
          ./check-invalidations "${INPUT}" "$$FILECHECK";
      done
    scripts:
      check-invalidations: |-
        #!/usr/bin/env bash
        set -euo pipefail

        BINARY="$1"
        FILECHECK="$2"

        WORKDIR="$(mktemp -d)"
        trap 'rm -rf "$WORKDIR"' EXIT
        cd "$WORKDIR"

        revng project init --overwrite --no-initial-auto-analysis "$BINARY";
        revng project analyze parse-binary -o /dev/null;

        PRE_ARTIFACT_PATCH="${FILECHECK/.filecheck/.pre-patch.yml}"
        if [[ -e "$PRE_ARTIFACT_PATCH" ]]; then
            revng project analyze apply-diff \
              -c "$PRE_ARTIFACT_PATCH" -o /dev/null
        fi

        revng project artifact enforce-abi -o /dev/null

        revng project analyze apply-diff \
          -c "$FILECHECK" -o /dev/null \
          --invalidations invalidations.yml

        FileCheck "$FILECHECK" < invalidations.yml
