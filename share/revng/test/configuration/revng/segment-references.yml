commands:
  - type: revng.test-segment-references
    from:
      - type: revng-qa.compiled-with-debug-info
        filter: for-segment-references
    suffix: /
    command: |-
      revng quick artifact cleanup-ir "$INPUT" -- --debug-names |
        revng opt -S |
        FileCheck ${SOURCE}.filecheck.ll
