tags:
  - name: import-prototypes-from-db

sources:
  - tags: [import-prototypes-from-db]
    prefix: share/revng/test/tests/import-prototypes-from-db
    members:
      - windows-x86-64.yml
      - linux-x86-64.yml
      - linux-arm.yml
      - arch-mismatch.yml
      - platform-name.yml

commands:
  - type: revng-db.import-prototypes-from-db-test
    from:
      - type: source
        filter: import-prototypes-from-db
    command: |-
      revng pipeline run-analysis import-prototypes-from-db "$INPUT"
        | revng model opt -verify
        | FileCheck "${COMMAND_ROOT}/${SOURCE}"
