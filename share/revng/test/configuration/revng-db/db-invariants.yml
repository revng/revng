tags:
  - name: db-invariants

sources:
  - tags: [db-invariants]
    prefix: share/revng/test/tests/db-invariants
    members:
      - no-createfilea-leak.sql

commands:
  - type: revng-db.db-invariant-test
    from:
      - type: source
        filter: db-invariants
    command: |-
      sqlite3 -cmd ".open \"file:$$(revng internal find-path share/revng/prototypes.sqlite)?immutable=1\"" < "$INPUT"
        | FileCheck "$INPUT"
