# This file contains ARM-specific failures.

# These failures are related to how padding registers are designated.
# But, unlike similar failures listed in the `RFTs.yml`, these *do* affect
# the `CFT->layout` path, meaning they might an indication of a deeper issue
# with how revng handles padding registers.
#
# TODO: investigate these sooner rather than later.
- ABIs:
    - AAPCS_hardfloat
    - AAPCS_softfloat
  tests:
    - mixed_64_32_bit_integer_arguments
    - mixed_int_64_struct_32_arguments
    - mixed_struct_64_int_32_arguments
    - struct_after_three_gprs
  errors:
    - Argument 2 uses neither the expected stack part nor the expected registers.
    - Argument 3 uses neither the expected stack part nor the expected registers.

# The floating-point cases for `AAPCS_softfloat`, previously blanket-disabled
# through `floating-point.yml`.
- ABIs:
    - AAPCS_softfloat
  tests:
    - mixed_double_float_arguments
    - mixed_double_float_struct_arguments
    - mixed_double_int_32_arguments
    - mixed_double_struct_32_arguments
    - mixed_double_struct_float_arguments
    - mixed_int_64_float_arguments
    - mixed_struct_64_float_arguments
  errors:
    - Argument 2 uses neither the expected stack part nor the expected registers.

# These failures are related to how the `abi::Definition::PackStackArguments`
# boolean is handled.
#
# IMPORTANT: these are an indication of issues with revng ABI handling and
# should be looked into sooner rather than later.
- ABIs:
    - Apple_AAPCS64
  tests:
    - apple_eight_byte_aligned_aggregate_on_stack
    - apple_four_byte_aligned_aggregate_on_stack
    - apple_padded_eight_byte_aligned_aggregate_on_stack
    - apple_padded_four_byte_aligned_aggregate_on_stack
    - apple_reverse_mixed_aggregates_on_stack
    - apple_two_byte_aligned_aggregate_on_stack
    - padded_float_struct_on_stack
    - padded_four_float_struct_on_stack
    - padded_unnaturally_sized_forteen_byte_struct_on_stack
  errors:
    - Argument 10 uses neither the expected stack part nor the expected registers.
    - Argument 11 uses neither the expected stack part nor the expected registers.
    - Argument 12 uses neither the expected stack part nor the expected registers.
    - Argument 15 uses neither the expected stack part nor the expected registers.
    - Argument 16 uses neither the expected stack part nor the expected registers.
    - Argument 17 uses neither the expected stack part nor the expected registers.
    - There are 7 unconsumed stack bytes - the layout shows the need for more stack bytes than necessary.
    - There are 8 unconsumed stack bytes - the layout shows the need for more stack bytes than necessary.

# These failures are related to the fact that the `AAPCS64` ABI treats HFAs in
# a special way even on the stack.
#
# `revngABI` places these correctly, but the testing suite is not robust enough
# to correctly process them. Since extending it is not trivial, leave these be
# for now.
#
# TODO: fix the testing suite.
- ABIs:
    - AAPCS64
    - Apple_AAPCS64
    - Microsoft_AAPCS64
  tests:
    - float_then_two_four_double_struct_arguments
    - padded_four_double_struct_on_stack
  errors:
    - Argument 2 uses neither the expected stack part nor the expected registers.
    - Argument 17 uses neither the expected stack part nor the expected registers.
