# These tests are due to a limitation of `model::RawFunctionDefinition`. Namely,
# it's inability to transparently handle padding registers (which we have to
# inject to ensure the following argument does not get mis-placed).
#
# Specifically, in order to get these to work, an RFT would have to allow,
# either:
# - representing a multi-register arguments explicitly, or
# - explicitly marking registers as padding (that is, not attaching a type to it)
#
# It's important to note that this is not a bug in revng-qa, nor does it have
# any negative consequences on either the RFT->CFT path nor Layout production
# for either RFTs or CFTs. It's a pure test-logic-related issue and the only
# potential problem with keeping it as is is the inability to test these
# specific cases.
#
# Example, `padded_sixteen_byte_scalar_in_registers(uint8_t, uint128_t)` on
# 32-bit ARM:
# - `CFT`: `uint8_t` in `r0`, `uint128_t` in `r2`, `r3` and 8 bytes of
#   stack, with `r1` holding padding;
# - `RFT`: `uint8_t` in `r0`, `generic32_t` is in `r1` to ensure padding is
#   accounted for, `uint128_t` is now four `generic32_t`s: two in registers
#   and two on the stack.
# - `CFT`: `uint8_t` in `r0`, `r1-r3` contain 3 generics, with two more generics
#   on the stack.

- ABIs:
    - AAPCS_hardfloat
    - AAPCS_softfloat
    - SystemV_MIPSEL_o32_hardfloat
    - SystemV_MIPSEL_o32_softfloat
    - SystemV_MIPS_o32_hardfloat
    - SystemV_MIPS_o32_softfloat
  tests:
    - mixed_32_64_bit_integer_arguments
    - mixed_int_32_struct_64_arguments
    - mixed_struct_32_int_64_arguments
    - padded_eight_byte_scalar_in_registers
    - padded_sixteen_byte_scalar_in_registers
  errors:
    - Argument 1 uses neither the expected stack part nor the expected registers.

# Same as above, but soft-float only.
- ABIs:
    - AAPCS_softfloat
    - SystemV_MIPSEL_o32_softfloat
    - SystemV_MIPS_o32_softfloat
  tests:
    - float_then_double_struct_arguments
    - float_then_four_double_struct_arguments
    - float_then_three_double_struct_arguments
    - float_then_two_double_struct_arguments
    - mixed_float_double_arguments
    - mixed_float_double_struct_arguments
    - mixed_float_int_64_arguments
    - mixed_float_struct_64_arguments
    - mixed_float_struct_double_arguments
    - mixed_int_32_double_arguments
    - mixed_struct_32_double_arguments
  errors:
    - Argument 1 uses neither the expected stack part nor the expected registers.

- ABIs:
    - AAPCS_hardfloat
    - AAPCS_softfloat
  tests:
    - mixed_int_32_huge_struct_arguments
    - mixed_struct_32_huge_struct_arguments
  errors:
    - Argument 1 uses neither the expected stack part nor the expected registers.

- ABIs:
    - AAPCS_softfloat
  tests:
    - float_then_five_double_struct_arguments
    - float_then_two_four_double_struct_arguments
    - mixed_float_huge_struct_arguments
  errors:
    - Argument 1 uses neither the expected stack part nor the expected registers.

- ABIs:
    - AAPCS64
  tests:
    - padded_sixteen_byte_scalar_in_registers
  errors:
    - Argument 1 uses neither the expected stack part nor the expected registers.
