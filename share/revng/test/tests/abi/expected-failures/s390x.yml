# This file contains s390x-specific failures.
#
# Some of these failures are due to bugs in how we test if our ABI
# implementation matches what happens in the actual code generated by
# the compiler (e.g., endianness issues), while others represent actual
# bugs/limitations in how we represent a certain ABI.
#
# Note that the s390x tests were only recently enabled, so this file is more of
# a backlog, rather than a description of intended behaviour.
#
# There are two distinct groups of problems:
#
# - Stack arguments. This is similar to the MIPS cases, a lot of fixes are
#   likely to be shared between the two. Some of these are also likely due
#   to the testing suite not checking the big endian sub-register-sized values
#   correctly.
#
# - Return values
#   Most of these are clearly due to endianness (consider that 64-bit primitive
#   works correctly, while the smaller ones are broken).
#
#   128-bit one is likely a separate issue, but there are already other known
#   problems with 128-bit primitive handling on other architectures - so this
#   one should be looked into as part of that effort.

