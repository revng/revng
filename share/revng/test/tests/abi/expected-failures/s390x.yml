#
# Return value problems
#

- ABIs:
    - SystemZ_s390x
  tests:
    - single_8_bit_return_value
    - single_16_bit_return_value
    - single_32_bit_return_value
    - single_128_bit_return_value
  errors:
    - A piece of the return value found in the r2_systemz register doesn't match the expected value.
    - Verification of the return value location register (r2_systemz) failed.
