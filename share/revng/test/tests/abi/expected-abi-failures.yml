# This file lists the abi test failures we are temporarily ok with.
#
# The format is the following:
#
#     - ABI: abi-name-regex
#       Test: test-name-regex
#       Error: error-message-regex
#
# A failure is accepted if it matches *any* one of the entries, BUT all *three*
# regexes must match *within* an entry for it to apply.
#
# NOTE: All three regexes are matched with `re.fullmatch`.

#
# Allow any failures in `float` and `double` tests.
#

- ABI: .*
  Test: .*(?:float|double).*
  Error: .*

#
# Known failures that require more expressive power in RFTs to enable.
#
# NOTE: these are issues with the test system, not with the `revngABI`.
#

- ABI: .*(?:AAPCS|MIPS).* # ALL the ARMs and MIPSes
  Test: extra_alignment_scalar_in_registers_64
  Error: Argument 1 uses neither the expected stack part nor the expected registers.
- ABI: Microsoft_AAPCS64
  Test: extra_alignment_scalar_in_registers_64
  Error: There are 8 unconsumed stack bytes - the layout shows the need for more stack bytes than necessary.

- ABI: .*AAPCS[^6][^4].* # ALL the 32-bit ARMs
  Test: extra_alignment_scalar_in_registers_32
  Error: There are 4 unconsumed stack bytes - the layout shows the need for more stack bytes than necessary.
- ABI: .*AAPCS[^6][^4].* # ALL the 32-bit ARMs
  Test: extra_alignment_scalar_in_registers_32
  Error: Argument 1 uses neither the expected stack part nor the expected registers.

#
# MIPS testing suite only works partially.
# So certain subsets of tests need to be disabled.
#
# TODO: investigate and re-enable these.
#
# NOTE: similar to the above, these are disabled because of the test system
#       limitations, but unlike a simple issue above, it's not viable to verify
#       all of these manually, so they are likely hiding real problems with
#       the `revngABI`.
#

# Easy to generalize cases that use stack.
- ABI: .*MIPS.* # ALL the mips ABIs
  Test: .*(?:stack|unnaturally|lots_of).*
  Error: .*

# Hard to generalize cases that use stack.
- ABI: .*MIPS.* # ALL the mips ABIs
  Test: (?:single_two_arrays_struct_argument|single_padded_struct_of_structs_argument|mixed_integer_arguments|equivalence_test_2_64_bit|equivalence_test_2_32_bit|extra_alignment_scalar_in_registers_32)
  Error: .*

# Non-primitive return values
- ABI: .*MIPS.* # ALL the mips ABIs
  Test: .*[^d].*_return_value
  Error: .*
