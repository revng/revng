# RUN: yaml2obj %s -o %t32.exe
# RUN: %root/bin/revng quick analyze --analyses=parse-binary %t32.exe -- --debug-info=no \
# RUN:   | FileCheck %s --check-prefixes=CHECK,CHECK32
# RUN: yaml2obj %s -DILT=00000000 -o %t32-fallback.exe
# RUN: %root/bin/revng quick analyze --analyses=parse-binary %t32-fallback.exe -- --debug-info=no \
# RUN:   | FileCheck %s --check-prefixes=CHECK,CHECK32
# RUN: yaml2obj %s -DMACHINE=IMAGE_FILE_MACHINE_AMD64 -DBASE=0x140000000 \
# RUN:   -DPAD=00000000 -o %t64.exe
# RUN: %root/bin/revng quick analyze --analyses=parse-binary %t64.exe -- --debug-info=no \
# RUN:   | FileCheck %s --check-prefixes=CHECK,CHECK64
# RUN: yaml2obj %s -DMACHINE=IMAGE_FILE_MACHINE_AMD64 -DBASE=0x140000000 \
# RUN:   -DPAD=00000000 -DILT=00000000 -o %t64-fallback.exe
# RUN: %root/bin/revng quick analyze --analyses=parse-binary %t64-fallback.exe -- --debug-info=no \
# RUN:   | FileCheck %s --check-prefixes=CHECK,CHECK64

# The ordinal-only entry and the repeated First import are skipped, but still
# occupy IAT slots. First and Second must refer to slots 1 and 3, respectively.
# CHECK-LABEL: ImportedDynamicFunctions:
# CHECK:       Name: First
# CHECK-NEXT:  Relocations:
# CHECK32-NEXT: - Address: "0x403004:Generic32"
# CHECK64-NEXT: - Address: "0x140003008:Generic64"
# CHECK:       Name: Second
# CHECK-NEXT:  Relocations:
# CHECK32-NEXT: - Address: "0x40300c:Generic32"
# CHECK64-NEXT: - Address: "0x140003018:Generic64"

---
!COFF
OptionalHeader:
  AddressOfEntryPoint: 0
  ImageBase: "[[BASE=0x400000]]"
  SectionAlignment: 4096
  FileAlignment: 512
  MajorOperatingSystemVersion: 6
  MajorSubsystemVersion: 6
  Subsystem: IMAGE_SUBSYSTEM_WINDOWS_CUI
  ImportTable:
    RelativeVirtualAddress: 0x1000
    Size: 40
header:
  Machine: "[[MACHINE=IMAGE_FILE_MACHINE_I386]]"
  Characteristics: [IMAGE_FILE_EXECUTABLE_IMAGE, IMAGE_FILE_DLL]
sections:
  - Name: .idata
    Characteristics: [IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ]
    VirtualAddress: 0x1000
    VirtualSize: 40
    # ILT RVA, timestamp, forwarder chain, DLL name RVA, IAT RVA; null descriptor
    # follows in the zero-filled remainder of the section.
    SectionData: "[[ILT=00200000]]00000000000000000040000000300000"
  - Name: .ilt
    Characteristics: [IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ]
    VirtualAddress: 0x2000
    VirtualSize: 40
    # Ordinal 1, First, First again, Second, then a zero-filled null entry.
    SectionData: "010000[[PAD=]]8010400000[[PAD=]]10400000[[PAD=]]20400000[[PAD=]]"
  - Name: .iat
    Characteristics: [IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ, IMAGE_SCN_MEM_WRITE]
    VirtualAddress: 0x3000
    VirtualSize: 40
    SectionData: "010000[[PAD=]]8010400000[[PAD=]]10400000[[PAD=]]20400000[[PAD=]]"
  - Name: .names
    Characteristics: [IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ]
    VirtualAddress: 0x4000
    VirtualSize: 41
    # example.dll at 0x4000; hint/name entries First at 0x4010 and Second at 0x4020.
    SectionData: "6578616d706c652e646c6c00000000000000466972737400000000000000000000005365636f6e6400"
symbols: []
