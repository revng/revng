#
# A DLL without symbols or an entry point exposes its functions only through
# the export table. Its ordinals are:
#
#   1: alpha and alias_alpha, two names for the same entry
#   2-6, 8, 10, 11: unused
#   7: a function exported by ordinal only
#   9: exported_data, which is not code
#   12: beta
#   13: forwarded, which points to KERNEL32.GetCurrentProcessId
#
# RUN: yaml2obj %s -o %t.dll
# RUN: %root/bin/revng quick analyze --analyses=parse-binary %t.dll | FileCheck %s

# CHECK:      Functions:
# CHECK-NEXT:   - Entry: "0x10001000:Code_x86"
# CHECK-NEXT:     Name: alias_alpha
# CHECK-NEXT:     ExportedNames:
# CHECK-NEXT:       - alias_alpha
# CHECK-NEXT:       - alpha
# CHECK-NEXT:   - Entry: "0x10001010:Code_x86"
# CHECK-NEXT:     Name: beta
# CHECK-NEXT:     ExportedNames:
# CHECK-NEXT:       - beta
# CHECK-NEXT:   - Entry: "0x10001020:Code_x86"
# CHECK-NEXT: TypeDefinitions:

---
!COFF
OptionalHeader:
  AddressOfEntryPoint: 0
  ImageBase: 0x10000000
  SectionAlignment: 0x1000
  FileAlignment: 0x200
  ExportTable:
    RelativeVirtualAddress: 0x2000
    Size: 217
header:
  Machine: IMAGE_FILE_MACHINE_I386
  Characteristics: [IMAGE_FILE_EXECUTABLE_IMAGE, IMAGE_FILE_32BIT_MACHINE, IMAGE_FILE_DLL]
sections:
  - Name: .text
    Characteristics: [IMAGE_SCN_CNT_CODE, IMAGE_SCN_MEM_EXECUTE, IMAGE_SCN_MEM_READ]
    VirtualAddress: 0x1000
    VirtualSize: 38
    SectionData: B811000000C3662E0F1F840000000000B817000000C3662E0F1F840000000000B81F000000C3
  - Name: .rdata
    Characteristics: [IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ]
    VirtualAddress: 0x2000
    VirtualSize: 217
    SectionData: 
  - Name: .data
    Characteristics: [IMAGE_SCN_CNT_INITIALIZED_DATA, IMAGE_SCN_MEM_READ, IMAGE_SCN_MEM_WRITE]
    VirtualAddress: 0x3000
    VirtualSize: 4
    SectionData: "07000000"
symbols: []
