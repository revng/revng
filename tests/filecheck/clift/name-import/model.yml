# Currently, this file is shared by *all* the name import tests.
# There are two categories of those:
# - header-specific tests, which should start from their own model and have
#   a clift module generated at runtime.
# - function-body tests, which should stay more or less as they are (as they
#   cannot be fully expressed using a model alone).

