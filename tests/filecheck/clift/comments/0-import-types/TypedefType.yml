# RUN: %root/bin/revng2 pipeline run-pipe import-types %s /dev/stdout | %root/bin/revng clift-opt | FileCheck %s

# NOTE: comments are intentionally missing from clift at this point!
#      This test is verifying that they will not get introduced too early.
#      To see how comment is represented on the IR, take a look at
#      `import-comments` test reusing this model file (it has the same name).

TypeDefinitions:
  # CHECK: !_type_definition_0_TypedefDefinition = !clift.typedef<
  # CHECK:   "/type-definition/0-TypedefDefinition" : !float96_t
  # CHECK: >
  - ID: 0
    Comment: |-
      Take a look at struct and function comment tests for more "meat".

      This one is just to ensure typedef-attached comments don't
      accidentally get broken!
    Kind: TypedefDefinition
    Name: "my_float"
    UnderlyingType:
      Kind: PrimitiveType
      PrimitiveKind: Float
      Size: 12

Architecture: x86_64
