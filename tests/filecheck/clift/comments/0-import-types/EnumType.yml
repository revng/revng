# RUN: %root/bin/revng pipe import-types %s /dev/null /dev/null /dev/stdout | %root/bin/revng clift-opt | FileCheck %s

# NOTE: comments are intentionally missing from clift at this point!
#      This test is verifying that they will not get introduced too early.
#      To see how comment is represented on the IR, take a look at
#      `import-comments` test reusing this model file (it has the same name).

TypeDefinitions:
  # CHECK: !_type_definition_0_EnumDefinition = !clift.enum<
  # CHECK:   "/type-definition/0-EnumDefinition" : !uint64_t {
  # CHECK:     "/enum-entry/0-EnumDefinition/0" : 0,
  # CHECK:     "/enum-entry/0-EnumDefinition/1" : 1,
  # CHECK:     "/enum-entry/0-EnumDefinition/18446744073709551615"
  # CHECK:       : 18446744073709551615
  # CHECK:   }
  # CHECK: >
  - ID: 0
    Kind: EnumDefinition
    Name: "my_commented_enum"
    Comment: |-
      Take a look at struct and function comment tests for more "meat".

      This one is just to ensure enum-attached comments don't
      accidentally get broken!
    UnderlyingType:
      Kind: PrimitiveType
      PrimitiveKind: Unsigned
      Size: 8
    Entries:
      - Value: 0
        Comment: Did I mention this value is zero?
      - Value: 1
        Comment: And this one - is one!
      - Value: 0xffffffffffffffff # 2^64 - 1
        Comment: And this one is too big for its own good!

Architecture: x86_64
