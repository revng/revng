# RUN: %root/bin/revng pipe import-types %s /dev/null /dev/stdout | %root/bin/revng clift-opt | FileCheck %s

# NOTE: comments are intentionally missing from clift at this point!
#      This test is verifying that they will not get introduced too early.
#      To see how comment is represented on the IR, take a look at
#      `import-comments` test reusing this model file (it has the same name).

Functions:
  - Entry: "0x4:Code_x86_64"
    Name: "my_commented_function"
    Comment: |-
      Unlike raw functions and all their complexities, CFTs are pretty
      straightforward as far as arguments are concerned. You just have the main
      comment, one for a return value, and one for each argument.
    Prototype:
      Kind: DefinedType
      Definition: "/TypeDefinitions/0-CABIFunctionDefinition"

TypeDefinitions:
  # CHECK: !_type_definition_0_CABIFunctionDefinition = !clift.func<
  # CHECK:   "/type-definition/0-CABIFunctionDefinition" : !uint8_t(!uint16_t, !uint32_t)
  # CHECK:   [
  # CHECK:     #clift.c_attribute<"_ABI" : "/macro/_ABI"
  # CHECK:       [
  # CHECK:         #clift.identifier<"SystemV_x86_64">
  # CHECK:       ]
  # CHECK:     >
  # CHECK:   ]
  # CHECK: >
  # CHECK: module attributes {clift.module, clift.test = [!_type_definition_0_CABIFunctionDefinition]} {
  # CHECK-NOT:   clift.func
  # CHECK: }
  - ID: 0
    Kind: CABIFunctionDefinition
    Comment: |-
      This comment is attached to the prototype (do not mistake it for
      the comment attached to the function itself!)
    ReturnValueComment: |-
      And this is what return value one is like!
    ABI: SystemV_x86_64
    ReturnType:
      Kind: PrimitiveType
      PrimitiveKind: Unsigned
      Size: 1
    Arguments:
      - Index: 0
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Unsigned
          Size: 2
        Comment: This is what an argument comment looks like!
      - Index: 1
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Unsigned
          Size: 4
        Comment: And another one, for good measure!

Segments:
  - StartAddress: "0x4:Generic64"
    VirtualSize: 0x40
    StartOffset: 0
    FileSize: 0x40
    IsReadable: true
    IsWriteable: false
    IsExecutable: true

Architecture: x86_64
