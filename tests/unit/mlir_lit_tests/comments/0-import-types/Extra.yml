# RUN: %revngpipe import-types %s /dev/null /dev/null /dev/stdout | %revngcliftopt | FileCheck %s

# NOTE: comments are intentionally missing from clift at this point!
#      This test is verifying that they will not get introduced too early.
#      To see how comment is represented on the IR, take a look at
#      `import-comments` test reusing this model file (it has the same name).

Functions:
  - Entry: "0x4:Code_x86_64"
    Name: "single_comment_function"
    Comment: |-
      This function only has the function comment, with nothing attached
      to the prototype!
    Prototype:
      Kind: DefinedType
      Definition: "/TypeDefinitions/0-CABIFunctionDefinition"

  - Entry: "0x8:Code_x86_64"
    Name: "argument_comment_function"
    Prototype:
      Kind: DefinedType
      Definition: "/TypeDefinitions/1-CABIFunctionDefinition"

  - Entry: "0xb:Code_x86_64"
    Name: "return_value_comment_function"
    Prototype:
      Kind: DefinedType
      Definition: "/TypeDefinitions/2-CABIFunctionDefinition"

TypeDefinitions:
  # CHECK: !_type_definition_0_CABIFunctionDefinition = !clift.func<
  # CHECK:   "/type-definition/0-CABIFunctionDefinition" : !uint8_t(!uint16_t, !uint32_t)
  # CHECK:   [
  # CHECK:     #clift.c_attribute<"_ABI" : "/macro/_ABI"
  # CHECK:       [
  # CHECK:         #clift.identifier<"SystemV_x86_64">
  # CHECK:       ]
  # CHECK:     >
  # CHECK:   ]
  # CHECK: >
  - ID: 0
    Kind: CABIFunctionDefinition
    ABI: SystemV_x86_64
    ReturnType:
      Kind: PrimitiveType
      PrimitiveKind: Unsigned
      Size: 1
    Arguments:
      - Index: 0
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Unsigned
          Size: 2
      - Index: 1
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Unsigned
          Size: 4

  # CHECK: !_type_definition_1_CABIFunctionDefinition = !clift.func<
  # CHECK:   "/type-definition/1-CABIFunctionDefinition" : !uint8_t(!uint16_t, !uint32_t)
  # CHECK:   [
  # CHECK:     #clift.c_attribute<"_ABI" : "/macro/_ABI"
  # CHECK:       [
  # CHECK:         #clift.identifier<"SystemV_x86_64">
  # CHECK:       ]
  # CHECK:     >
  # CHECK:   ]
  # CHECK: >
  - ID: 1
    Kind: CABIFunctionDefinition
    ABI: SystemV_x86_64
    ReturnType:
      Kind: PrimitiveType
      PrimitiveKind: Unsigned
      Size: 1
    Arguments:
      - Index: 0
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Unsigned
          Size: 2
      - Index: 1
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Unsigned
          Size: 4
        Comment: This function only has an argument comment!

  # CHECK: !_type_definition_2_CABIFunctionDefinition = !clift.func<
  # CHECK:   "/type-definition/2-CABIFunctionDefinition" : !uint8_t(!uint16_t, !uint32_t)
  # CHECK:   [
  # CHECK:     #clift.c_attribute<"_ABI" : "/macro/_ABI"
  # CHECK:       [
  # CHECK:         #clift.identifier<"SystemV_x86_64">
  # CHECK:       ]
  # CHECK:     >
  # CHECK:   ]
  # CHECK: >
  - ID: 2
    Kind: CABIFunctionDefinition
    ReturnValueComment: |-
      This function only has a return value comment!
    ABI: SystemV_x86_64
    ReturnType:
      Kind: PrimitiveType
      PrimitiveKind: Unsigned
      Size: 1
    Arguments:
      - Index: 0
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Unsigned
          Size: 2
      - Index: 1
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Unsigned
          Size: 4

Segments:
  - StartAddress: "0x4:Generic64"
    VirtualSize: 0x40
    StartOffset: 0
    FileSize: 0x40
    IsReadable: true
    IsWriteable: false
    IsExecutable: true

Architecture: x86_64
