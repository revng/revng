# RUN: %revngpipe import-clift-types %s /dev/null /dev/null /dev/stdout | %revngcliftopt | FileCheck %s

Architecture: x86_64

TypeDefinitions:
  # CHECK: !_type_definition_1001_StructDefinition = !clift.struct<
  # CHECK:   "/type-definition/1001-StructDefinition"
  # CHECK:   : size(64)
  # CHECK:   {}
  # CHECK:   [#clift.attribute<"_CAN_CONTAIN_CODE" : "/macro/_CAN_CONTAIN_CODE">]
  # CHECK: >
  - ID: 1001
    Kind: StructDefinition
    Name: "my_struct"
    Size: 64
    Fields: []

    CanContainCode: true

  # CHECK: !_type_definition_1002_StructDefinition = !clift.struct<
  # CHECK:   "/type-definition/1002-StructDefinition"
  # CHECK:   : size(64)
  # CHECK:   {}
  # CHECK-NOT:   [#clift.attribute<"_CAN_CONTAIN_CODE" : "/macro/_CAN_CONTAIN_CODE">]
  # CHECK: >
  - ID: 1002
    Kind: StructDefinition
    Name: "my_struct"
    Size: 64
    Fields: []

    # CanContainCode: true
