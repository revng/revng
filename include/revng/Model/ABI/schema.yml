#            anything you wouldn't add to the model.

version: 1
root_type: Definition
definitions:
  - name: Definition
    type: struct
    doc: for the documentation see `references/abi-definition.md`
    fields:
      - name: ABI
        doc: The name of the ABI this definition describes.
        type: model::ABI::Values

      - name: ArgumentsArePositionBased
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: OnlyStartDoubleArgumentsFromAnEvenRegister
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: ArgumentsCanBeSplitBetweenRegistersAndStack
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: BigArgumentsUsePointersToCopy
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: NoRegisterArgumentsCanComeAfterStackOnes
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: AllowPackedTypesInRegisters
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: CalleeIsResponsibleForStackCleanup
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: UseSystemVx86_64RegisterSelectionLogic
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: PackStackArguments
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: TreatAllAggregatesAsPacked
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: StackAlignment
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: uint64_t
        default: -1

      - name: MinimumStackArgumentSize
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: uint64_t
        default: -1

      - name: UnusedStackArgumentBytes
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: uint64_t
        default: 0

      - name: MaximumGPRsPerAggregateArgument
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: uint64_t
        default: 0

      - name: MaximumGPRsPerAggregateReturnValue
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: uint64_t
        default: 0

      - name: MaximumGPRsPerScalarArgument
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: uint64_t
        default: 0

      - name: MaximumGPRsPerScalarReturnValue
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: uint64_t
        default: 0

      - name: GeneralPurposeArgumentRegisters
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        sequence:
          type: std::vector
          elementType: model::Register::Values

      - name: GeneralPurposeReturnValueRegisters
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        sequence:
          type: std::vector
          elementType: model::Register::Values

      - name: FloatArgumentRegisters
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        sequence:
          type: std::vector
          elementType: model::Register::Values

      - name: FloatReturnValueRegisters
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        sequence:
          type: std::vector
          elementType: model::Register::Values

      - name: CalleeSavedRegisters
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        sequence:
          type: std::vector
          elementType: model::Register::Values

      - name: ReturnValueLocationRegister
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: model::Register::Values

      - name: ReturnValueLocationOnStack
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: ReturnValueLocationIsReturned
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        type: bool
        default: false

      - name: FloatingPointArgumentStrategy
        doc: |
          Determines how floating point *arguments* are passed.
          Every ABI must set this explicitly. It must not be `Invalid`.
        type: FloatingPointStrategy
        default: Invalid

      - name: FloatingPointReturnValueStrategy
        doc: |
          Determines how floating point values are *returned.*
          Every ABI must set this explicitly. It must not be `Invalid`.
        type: FloatingPointStrategy
        default: Invalid

      - name: MaximumHFAFieldCount
        doc: |
          HFA stands for "Homogeneous Floating-point Aggregate" as described
          by the "Procedure Call Standard" documents for both 32-bit and 64-bit
          ARM calling conventions.

          When this option is set to 0, the homogeneous-struct-only logic does
          *not* apply and *all* the structs are allowed to use floating point
          registers.

          When this is set to any other value, *only* aggregates that are
          considered homogeneous (see below) *and* have total number of *fields*
          less or equal to the value of this option can use dedicated floating
          point registers.

          Here are some examples of impact this function would have on sample
          arguments. For the example's sake, let's assume that the ABI in
          question has `MaximumHFAFieldCount` set to 4 (ARM-64 value).

          ```cpp
          struct one_float { float f; };
          // HFA with one field, which is <=4: uses float registers.

          struct two_floats { float f1, f2; };
          // HFA with two fields, which is <=4: uses float registers.

          struct three_floats { float f1, f2, f3; };
          // HFA with three fields, which is <=4: uses float registers.

          struct four_floats { float f1, f2, f3, f4; };
          // HFA with four fields, which is <=4: uses float registers.

          struct five_floats { float f1, f2, f3, f4, f5; };
          // HFA with five fields, which is >4: is not treated as an HFA.

          struct float_array { float a[2]; };
          // HFA (arrays are treated the same as fields): uses float registers.

          struct float_array_plus_struct { float a[2]; struct two_floats s; };
          // HFA (2+2=4 total fields): uses float registers.

          struct float_array_plus_bigger_struct { float a[2]; struct three_floats s; };
          // HFA (2+3=5 total fields): is not treated as an HFA.

          struct mixed_sizes { float f; double d; };
          // Not a HFA.

          struct mixed_kinds { float f; uint32_t i; };
          // Not a HFA.

          union union_with_hfa_fields { struct four_floats s0; struct three_floats s1; };
          // Union is a HFA if *all* its fields are HFAs: uses float registers.

          union union_with_hfa_fields { struct four_floats s0; struct mixed_kinds s1; };
          // The second field is not a HFA: the union is not treated as an HFA.
          ```
        type: uint64_t
        default: 0

      - name: ScalarTypes
        doc: |
          See `revng/share/doc/revng/references/abi-definition.md` for details.
        sequence:
          type: SortedVector
          elementType: ScalarType

      - name: PrimitiveAliases
        doc: |
          The list of ABI-specific primitive aliases (e.g., `size_t`,
          `intptr_t`).
        sequence:
          type: SortedVector
          elementType: PrimitiveAlias

    key:
      - ABI

  - name: PrimitiveAlias
    type: struct
    doc: |
      Attaches a specific primitive type to an arbitrary name (e.g. `size_t`).
    fields:
      - name: Name
        doc: The alias name (e.g. `size_t`).
        type: string

      - name: Kind
        doc: The primitive kind of the aliased type.
        type: model::PrimitiveKind::Values

      - name: Size
        doc: The size of the aliased type, in bytes.
        type: uint64_t

    key:
      - Name

  - name: ScalarType
    type: struct
    doc: |
      Represents type specific information ABI needs to be aware of,
      for example, alignment.
    fields:
      - name: Kind
        doc: The kind of the scalar (`Integer` or `FloatingPoint`).
        type: ScalarKind

      - name: Size
        doc: The size of the scalar type, in bytes.
        type: uint64_t
        default: -1

        # TODO: For MS x86 ABIs, alignment of 4 is incorrectly used for long
        #       long. The reason being that the MS ABI seems to align all stack
        #       arguments to 4 bytes. To fix this, a separate stack alignment
        #       field is probably needed (single per-ABI value may be enough).

      - name: AlignedAt
        doc: |
          The alignment of this scalar, in bytes.
          When set to `0`, the alignment of this type matches its size.
        type: uint64_t
        default: 0

      - name: CTypes
        doc: The list of C types this scalar can be described as.
        sequence:
          type: SortedVector
          elementType: CType

    key:
      - Kind
      - Size

  - name: ScalarKind
    type: enum
    doc: |
      Whether a scalar is an integer or a floating-point value.
    members:
      - name: Integer
      - name: FloatingPoint

  - name: FloatingPointStrategy
    type: enum
    doc: |
      Describes the strategy an ABI uses to pass a single floating point
      argument (or return value) around.
    members:
      - name: NextRegisterFromTheDedicatedSet
        doc: |
          Each value consumes the next free register from the dedicated
          floating point register set (`FloatArgumentRegisters` or
          `FloatReturnValueRegisters`). Once the set is exhausted, the stack is
          used instead.

      - name: NextRegisterFromTheGeneralPurposeRegisterSet
        doc: |
          Values are passed like any other value, that is, using the general
          purpose registers and, once those are exhausted, the stack.

      - name: Stack
        doc: |
          Values never occupy a register. Depending on whether the ABI is
          position-based, they are passed on the stack directly or replaced
          with a pointer to a copy.

      - name: Ignored
        doc: |
          Floating point argument/return-values are not supported under this
          ABI. They should be ignored in layouts and should prevent all
          the functions using them from ever being promoted to a CFT.

  - name: CType
    type: enum
    doc: |
      The C type a primitive type can be described as.
    members:
      - name: Char
      - name: Short
      - name: Int
      - name: Long
      - name: LongLong
      - name: Float
      - name: Double
      - name: LongDouble
