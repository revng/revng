[project]
name = "revng-python-dependencies"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.14,<4"
dependencies = [
    # Python language checkers/formatters
    "black>=25.1.0,<26.0",
    "flake8>=7.0.0,<8.0",
    "flake8-breakpoint>=1.1.0,<2.0",
    "flake8-builtins>=3.1.0,<4.0",
    "flake8-comprehensions>=3.10.1,<4.0",
    "flake8-eradicate>=1.4.0,<2.0",
    "flake8-simplify>=0.19.3,<1.0",
    "pep8-naming>=0.13.3,<1.0",
    "isort>=8.0.0,<9.0",
    "codespell>=2.2.2,<3.0",
    "mypy==1.20.2",

    # Python types
    "boto3-stubs[s3]",
    "types-backports",
    "types-PyYAML",
    "types-requests",
    "types-urllib3",
    "types-jsonschema>=4.17.0.10,<4.18.0",

    # cmake-format executable
    "cmakelang",

    # Applications/Script dependencies
    "ariadne[asgi-file-uploads]>=0.23.0,<0.29.0",
    "boto3<=1.35.99",
    # cffi >=2.0 — earlier versions have no cp314 wheels.
    "cffi>=2.0",
    "Jinja2",
    "gql[aiohttp]==3.5.2",
    "grandiso",
    "jsonschema",
    "jsonschema-to-typeddict>=1.4.2,<2.0",
    "networkx>=3.3",
    "pefile",
    "pycparser",
    "pydot>=3.0.2",
    "pyelftools",
    "zstandard",
    "click>=8.3.0,<9.0",
    "click-option-group>=0.5.9,<1.0",
    "starlette[full]>=0.52.1",
    "psycopg[c,pool]>=3.3.3,<4.0",
    "hypercorn>=0.18.0,<1.0",
    "uvloop",

    "python-idb",

    "pytest",
    "pytest-asyncio",
    "requests",
    "requests-toolbelt",
    "psutil",
    "build",
    "llvmcpy",

    # uvicorn[standard] but without watchfiles (since it requires rust)
    "uvicorn==0.41.0",
    "httptools>=0.6.3",
    "python-dotenv>=0.13",
    "websockets>=10.4",

    "xdg",

    "marko",
    "mkdocs<2.0",
    "mkdocs-graphviz",
    "mkdocs-material",

    "yachalk",
    "yq",

    # Build tooling kept from previous flake setup.
    "wheel",
    "setuptools>=82.0.0",
    "pip>=26.0.1",
    "expandvars>=0.12.0,<0.13",
    "pyyaml>=6.0.2",
    "lit>=18.1.8",
]

[tool.uv.sources]
grandiso = { git = "https://github.com/revng/grandiso-networkx.git", rev = "043ce4b" }
jsonschema = { git = "https://github.com/revng/jsonschema.git", rev = "c17ffb2" }
python-idb = { git = "https://github.com/revng/python-idb.git", rev = "08ba07a" }
llvmcpy = { git = "https://github.com/revng/llvmcpy.git", rev = "9eca23b" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
